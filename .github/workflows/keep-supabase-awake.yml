# Supabase pauses free projects after a week without database activity, which
# would break the contact form. This pings the contact function once a day; the
# ping runs one tiny database query (see supabase/functions/contact/index.ts).
#
# Note: GitHub turns off scheduled workflows in a public repo after 60 days with
# no commits, and emails a warning first. Any push to main turns it back on.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 30 "https://lvxzaydposdtqowicflm.supabase.co/functions/v1/contact?ping"
