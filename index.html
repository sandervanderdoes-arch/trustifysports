<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-ts.png?v=3" />
    <link rel="apple-touch-icon" href="/logo-512.png" />
    <meta name="theme-color" content="#1F2747" />
    <meta name="author" content="Trustify Sports" />

    <!-- Page-specific tags (title, description, canonical, og:*, JSON-LD) are added per
         route by src/components/Seo.tsx and baked into each page by scripts/prerender.mjs. -->
    <meta property="og:site_name" content="Trustify Sports" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image" content="https://trustifysports.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trustify Sports" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://trustifysports.com/og-image.png" />

    <!-- Inter, loaded without blocking the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
      <!-- Without JavaScript the scroll-reveal never runs, so show the content straight away. -->
      <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
    </noscript>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://trustifysports.com/#organization",
          "name": "Trustify Sports",
          "url": "https://trustifysports.com/",
          "logo": "https://trustifysports.com/logo-512.png",
          "image": "https://trustifysports.com/og-image.png",
          "email": "sander@trustifysports.com",
          "description": "AML and KYC compliance for professional football clubs and football agents under the EU Anti-Money Laundering Regulation (Regulation (EU) 2024/1624): a platform built for football, compliance experts and ongoing support.",
          "slogan": "Building the compliance standard for European Football",
          "areaServed": "Europe",
          "knowsAbout": ["Anti-money laundering", "EU Anti-Money Laundering Regulation (AMLR)", "Know your customer (KYC)", "Customer due diligence", "Football clubs", "Football agents"],
          "contactPoint": { "@type": "ContactPoint", "contactType": "sales", "email": "sander@trustifysports.com", "availableLanguage": ["English"] },
          "sameAs": ["https://www.linkedin.com/company/trustify-sports/"]
        },
        {
          "@type": "WebSite",
          "@id": "https://trustifysports.com/#website",
          "name": "Trustify Sports",
          "url": "https://trustifysports.com/",
          "inLanguage": "en",
          "publisher": { "@id": "https://trustifysports.com/#organization" }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
